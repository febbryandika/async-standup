services:
  db:
    image: postgres:16-alpine
    container_name: async-standup-db
    restart: unless-stopped
    ports:
      # Override DB_PORT if something already owns 5432 on the host.
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: async_standup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d async_standup']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
